name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Local Supabase stack's Postgres — enables the DB-backed test suites.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck

      # Starts a fresh database and applies every migration in supabase/migrations.
      # Services no test uses are excluded to keep the image pulls short.
      - run: pnpm db:start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,realtime,supavisor,postgres-meta,mailpit
      - run: pnpm test

  # Playwright against the local stack — pushes to main (and manual runs) only; see docs/plan.md.
  e2e:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @notes/web exec playwright install --with-deps chromium
      # Auth (GoTrue) and the API gateway are needed here, so only unrelated services are excluded.
      - run: pnpm db:start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,realtime,supavisor,postgres-meta,mailpit
      - run: pnpm --filter @notes/web e2e
        env:
          CI: true
          # Scripted fake instead of Claude/Groq; the seeded user is created by `db:start`.
          AI_FAKE: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
